<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🎓 Student Management System</h1>

    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" class="logo">

    <div class="form">
        <input type="text" id="name" placeholder="Enter Name">
        <input type="number" id="age" placeholder="Enter Age">
        <input type="text" id="id" placeholder="Enter Student ID">
        <input type="text" id="course" placeholder="Enter Course">
    </div>

    <div class="buttons">
        <button onclick="addStudent()">➕ Add</button>
        <button onclick="displayStudents()">📋 Display</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchId" placeholder="Search by ID">
        <button onclick="searchStudent()">🔍 Search</button>
    </div>

    <h2>📊 Student Records</h2>
    <div id="output"></div>

</div>

<script src="script.js"></script>

</body>
</html>
